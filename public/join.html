<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>join · buzz</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;700&display=swap"
      rel="stylesheet"
    />
    <link rel="icon" href="favicon.ico" sizes="48x48" />
    <link rel="icon" type="image/png" href="favicon-32.png" sizes="32x32" />
    <link rel="apple-touch-icon" href="apple-touch-icon.png" />
    <link rel="stylesheet" href="css/styles.css" />
  </head>
  <body class="page-join">
    <main class="shell">
      <div class="spread">
        <h1 class="title">join<span class="cursor" aria-hidden="true">▌</span></h1>
        <a class="btn" href="index.html">back</a>
      </div>
      <p class="subtitle">pick a name, a colour and your buzz sound.</p>

      <hr class="rule" />

      <form id="join-form" class="box" autocomplete="off">
        <h2 class="box-title">new player</h2>

        <div class="field">
          <label for="join-code">code</label>
          <input id="join-code" class="input code-input" maxlength="4" placeholder="ABCD" required />
        </div>

        <div class="field">
          <label for="join-name">name</label>
          <input id="join-name" class="input" maxlength="20" placeholder="your name" required />
        </div>

        <div class="field field-top">
          <span class="field-label">colour</span>
          <div id="swatches" class="swatches" role="group" aria-label="Buzzer colour">
            <p class="dim small">enter a room code first</p>
          </div>
        </div>

        <div class="field field-top">
          <span class="field-label">sound</span>
          <div>
            <ul id="sound-list" class="sound-list" aria-label="Buzz sound">
              <li class="dim small sound-empty">enter a room code first</li>
            </ul>
            <p class="dim small" style="margin-top: 6px">tap a sound to hear it on this device.</p>
          </div>
        </div>

        <button type="submit" class="btn btn-primary btn-block" id="join-btn">join</button>
      </form>
    </main>

    <script src="/socket.io/socket.io.js"></script>
    <script src="js/common.js"></script>
    <script src="js/audio.js"></script>
    <script src="js/join.js"></script>
  </body>
</html>
